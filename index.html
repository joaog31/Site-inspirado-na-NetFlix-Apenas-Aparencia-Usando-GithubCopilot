<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETFLIX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Logo Netflix no canto superior esquerdo -->
    <nav class="navbar">
        <div class="logo">NETFLIX</div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Modo Claro">Modo Claro</button>
    </nav>

    <main>
        <header>
            <h1>Quem está assistindo?</h1>
            <p class="helper-text">Escolha um perfil para continuar</p>
        </header>

        <section aria-label="Selecao de perfis">
            <ul class="container">
                <li class="profile-item">
                    <button class="profile" type="button" aria-label="Entrar com o perfil João Gabriel">
                        <figure>
                            <img src="ativos/perfis/profile1.svg" alt="Perfil 1">
                            <figcaption>João Gabriel</figcaption>
                        </figure>
                    </button>
                </li>
                <li class="profile-item">
                    <button class="profile" type="button" aria-label="Entrar com o perfil Yara Maria">
                        <figure>
                            <img src="ativos/perfis/profile2.svg" alt="Perfil 2">
                            <figcaption>Yara Maria</figcaption>
                        </figure>
                    </button>
                </li>
                <li class="profile-item">
                    <button class="profile" type="button" aria-label="Entrar com o perfil Lucas Silva">
                        <figure>
                            <img src="ativos/perfis/profile3.svg" alt="Perfil 3">
                            <figcaption>Lucas Silva</figcaption>
                        </figure>
                    </button>
                </li>
                <li class="profile-item">
                    <button class="profile" type="button" aria-label="Entrar com o perfil Ana Clara">
                        <figure>
                            <img src="ativos/perfis/profile4.svg" alt="Perfil 4">
                            <figcaption>Ana Clara</figcaption>
                        </figure>
                    </button>
                </li>
            </ul>
        </section>

        <div class="manage-section">
            <button id="manage-profiles-btn" class="manage-btn" type="button" aria-label="Gerenciar perfis">
                <i class="icon">⚙️</i> Gerenciar perfis
            </button>
        </div>
    </main>

    <!-- Modal de Gerenciamento de Perfis -->
    <div id="manage-modal" class="modal" hidden>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Gerenciar Perfis</h2>
                <button id="modal-close" class="modal-close" type="button" aria-label="Fechar">✕</button>
            </div>

            <div class="modal-body">
                <div class="profiles-list" id="profiles-list"></div>

                <div class="modal-section" id="new-profile-section">
                    <h3>Criar novo perfil</h3>
                    <div class="form-group">
                        <label for="profile-name">Nome do perfil:</label>
                        <input type="text" id="profile-name" placeholder="Digite o nome do novo perfil" maxlength="20">
                    </div>

                    <div class="form-group">
                        <label for="profile-avatar">Escolha um avatar:</label>
                        <div class="avatar-options" id="avatar-options"></div>
                    </div>

                    <button id="create-profile-btn" class="btn-primary" type="button">Criar perfil</button>
                </div>
            </div>

            <div class="modal-footer">
                <p id="profile-count" class="profile-count"></p>
            </div>
        </div>
    </div>
    <script src="js/compartilhado/tema.js" defer></script>
    <script type="module" src="js/compartilhado/selecao-perfil.js"></script>
</body>
</html>
