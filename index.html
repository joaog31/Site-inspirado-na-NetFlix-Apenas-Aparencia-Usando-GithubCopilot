<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETFLIX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Logo Netflix no canto superior esquerdo -->
    <nav class="navbar">
        <div class="logo">NETFLIX</div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Modo Claro">Modo Claro</button>
    </nav>

    <main>
        <header>
            <h1>Quem está assistindo?</h1>
            <p class="helper-text">Escolha um perfil para continuar</p>
        </header>

        <section aria-label="Selecao de perfis">
            <ul class="container">
                <li class="profile">
                    <figure>
                        <img src="Assets/profile1.svg" alt="Perfil 1">
                        <figcaption>João Gabriel</figcaption>
                    </figure>
                </li>
                <li class="profile">
                    <figure>
                        <img src="Assets/profile2.svg" alt="Perfil 2">
                        <figcaption>Yara Maria</figcaption>
                    </figure>
                </li>
                <li class="profile">
                    <figure>
                        <img src="Assets/profile3.svg" alt="Perfil 3">
                        <figcaption>Lucas Silva</figcaption>
                    </figure>
                </li>
                <li class="profile">
                    <figure>
                        <img src="Assets/profile4.svg" alt="Perfil 4">
                        <figcaption>Ana Clara</figcaption>
                    </figure>
                </li>
            </ul>
        </section>

    </main>
    <script src="theme.js" defer></script>
</body>
</html>
