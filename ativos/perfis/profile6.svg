<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#1a1a2e"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="grad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Head -->
  <circle cx="100" cy="70" r="35" fill="url(#grad6)"/>
  
  <!-- Hair/Crown -->
  <path d="M 70 45 Q 70 30 100 28 Q 130 30 130 45 L 128 50 Q 100 48 72 50 Z" fill="#c71552"/>
  
  <!-- Eyes -->
  <circle cx="90" cy="65" r="4" fill="#fff"/>
  <circle cx="110" cy="65" r="4" fill="#fff"/>
  <circle cx="90" cy="65" r="2" fill="#1a1a2e"/>
  <circle cx="110" cy="65" r="2" fill="#1a1a2e"/>
  
  <!-- Eyebrows -->
  <path d="M 85 60 Q 90 58 95 60" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 105 60 Q 110 58 115 60" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Mouth - Smile -->
  <path d="M 88 82 Q 100 88 112 82" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Body -->
  <rect x="70" y="110" width="60" height="65" rx="10" fill="url(#grad6)"/>
  
  <!-- Shirt pattern -->
  <circle cx="85" cy="125" r="3" fill="#fff" opacity="0.4"/>
  <circle cx="100" cy="125" r="3" fill="#fff" opacity="0.4"/>
  <circle cx="115" cy="125" r="3" fill="#fff" opacity="0.4"/>
  
  <!-- Arms -->
  <rect x="40" y="120" width="30" height="15" rx="8" fill="url(#grad6)"/>
  <rect x="130" y="120" width="30" height="15" rx="8" fill="url(#grad6)"/>
</svg>