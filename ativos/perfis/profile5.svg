<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#1a1a2e"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Head -->
  <circle cx="100" cy="70" r="35" fill="url(#grad5)"/>
  
  <!-- Hair/Top -->
  <path d="M 65 50 Q 65 35 100 35 Q 135 35 135 50" fill="#5a4a7f" stroke="none"/>
  
  <!-- Eyes -->
  <circle cx="90" cy="65" r="4" fill="#fff"/>
  <circle cx="110" cy="65" r="4" fill="#fff"/>
  <circle cx="90" cy="65" r="2" fill="#000"/>
  <circle cx="110" cy="65" r="2" fill="#000"/>
  
  <!-- Mouth -->
  <path d="M 90 80 Q 100 85 110 80" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Body -->
  <rect x="70" y="110" width="60" height="65" rx="10" fill="url(#grad5)"/>
  
  <!-- Shirt accent -->
  <rect x="70" y="110" width="60" height="15" rx="10" fill="#764ba2" opacity="0.6"/>
  
  <!-- Arms -->
  <rect x="40" y="120" width="30" height="15" rx="8" fill="url(#grad5)"/>
  <rect x="130" y="120" width="30" height="15" rx="8" fill="url(#grad5)"/>
</svg>